<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlayStation Games</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #1a1a1a; --muted: #636363; --line: #e3e3e3; --chip: #eef2f9; --head: #f7f7f7;
    --stale-bg: #fde8e8; --stale-fg: #8a1414;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121417; --fg: #e8e8e8; --muted: #a0a0a0; --line: #2c3036; --chip: #1f252d; --head: #181b1f; --stale-bg: #3a1717; --stale-fg: #ffb4b4; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, sans-serif; }
  header { padding: 16px; }
  h1 { margin: 0 0 12px; font-size: 20px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .filters input, .filters select {
    font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--fg); max-inline-size: 100%;
  }
  .filters input[type=search] { flex: 1 1 200px; }
  .count { color: var(--muted); margin-block-start: 8px; font-size: 13px; }

  .table-wrapper { overflow: auto; max-block-size: calc(100dvh - 40px); container-type: inline-size; }
  table { border-collapse: separate; border-spacing: 0; inline-size: 100%; }
  th, td { padding: 8px; border-block-end: 1px solid var(--line); text-align: start; vertical-align: middle; }
  thead { position: sticky; inset-block-start: 0; z-index: 1; background: var(--head); }
  thead th { white-space: nowrap; font-size: 13px; font-weight: 600; color: var(--muted); }
  thead button { all: unset; cursor: pointer; }
  thead button:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
  th[aria-sort=ascending] button::after { content: " \25B2"; }
  th[aria-sort=descending] button::after { content: " \25BC"; }
  tbody th { font-weight: 600; }
  tbody th button { all: unset; cursor: pointer; }
  tbody th button:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
  tr.desc td { color: var(--muted); background: var(--chip); }
  img { inline-size: 40px; block-size: 40px; object-fit: cover; border-radius: 4px; display: block; }
  td.cover button { all: unset; cursor: zoom-in; display: block; }
  td.cover button:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
  td.nowrap { white-space: nowrap; }
  tr.desc a { margin-inline-end: 16px; }
  .links { margin-block-start: 8px; }
  dialog { padding: 0; border: 0; border-radius: 8px; background: transparent; max-inline-size: 92vw; max-block-size: 92dvh; }
  dialog::backdrop { background: rgb(0 0 0 / 0.75); }
  dialog img { inline-size: auto; block-size: auto; max-inline-size: 92vw; max-block-size: 92dvh; border-radius: 8px; cursor: zoom-out; }
  .tag { display: inline-block; margin-inline-start: 4px; padding: 1px 6px; border-radius: 4px; background: var(--chip); font-size: 12px; font-weight: 400; }
  tr.gone { opacity: 0.55; }
  .sync { color: var(--muted); font-size: 13px; margin: -6px 0 12px; }
  .stale { margin: 0 0 12px; padding: 10px 12px; border-radius: 8px; background: var(--stale-bg); color: var(--stale-fg); }
  .stale code { font-size: 13px; }

  /* Narrow: one card per game, each value labelled. */
  @container (width < 700px) {
    table, thead, tbody, tr, th, td { display: block; }
    thead { display: none; }
    tr.game { border: 1px solid var(--line); border-radius: 8px; margin: 0 12px 12px; padding: 4px 0; }
    tr.desc { margin: -8px 12px 12px; }
    tr.game td, tr.game th { border: 0; padding: 4px 12px; }
    tr.game td.cover { float: inline-start; padding-inline-end: 0; }
    tr.game td[data-label]::before {
      content: attr(data-label) ": " / attr(data-label);
      color: var(--muted);
    }
  }
</style>
</head>
<body>
<header>
  <h1>PlayStation Games</h1>
  <p class="sync" id="sync"></p>
  <div class="stale" id="stale" role="alert" hidden>
    The list has not been updated since <strong id="stale-date"></strong>. The monthly sync has probably
    stopped because the PlayStation login has expired. Renew it on the PC that runs the sync:
    <code>pwsh -File scripts/renew-psn.ps1</code> in the repo folder.
  </div>
  <div class="filters">
    <input type="search" id="q" placeholder="Search title" aria-label="Search title">
    <select id="access" aria-label="Access">
      <option value="present">Owned + claimed</option>
      <option value="owned">Owned</option>
      <option value="claimed">Claimed</option>
      <option value="gone">Gone</option>
      <option value="all">All</option>
    </select>
    <select id="platform" aria-label="Platform">
      <option value="">Any platform</option><option>PS5</option><option>PS4</option>
    </select>
    <select id="couch" aria-label="Couch play">
      <option value="">Couch: no filter</option>
      <option value="coop">Couch co-op</option>
      <option value="versus">Couch versus</option>
      <option value="any">Couch: any</option>
    </select>
    <select id="online" aria-label="Online play">
      <option value="">Online: no filter</option>
      <option value="coop">Online co-op</option>
      <option value="versus">Online versus</option>
    </select>
    <label><input type="checkbox" id="solo"> Solo story</label>
  </div>
  <div class="count" id="count" role="status"></div>
</header>
<div class="table-wrapper">
  <table>
    <thead>
      <tr>
        <td></td>
        <th scope="col" data-k="title" title="Click a title for its description and links"><button type="button">Title</button></th>
        <th scope="col" data-k="platforms"><button type="button">Platform</button></th>
        <th scope="col" data-k="releaseYear"><button type="button">Year</button></th>
        <th scope="col" data-k="ageRating"><button type="button">Age</button></th>
        <th scope="col" data-k="soloStory" title="Has a story you can play through alone"><button type="button">Solo</button></th>
        <th scope="col" data-k="couchCoopMax" title="Play together on one console (max players)"><button type="button">Couch co-op</button></th>
        <th scope="col" data-k="couchVersusMax" title="Play against each other on one console (max players)"><button type="button">Couch versus</button></th>
        <th scope="col" data-k="onlineCoop" title="Play together over the internet (max players)"><button type="button">Online co-op</button></th>
        <th scope="col" data-k="onlineVersus" title="Play against others over the internet (max players)"><button type="button">Online versus</button></th>
        <th scope="col" data-k="localPlayers" title="Players on one console / over the internet, from the PlayStation Store"><button type="button">Players</button></th>
        <th scope="col" data-k="genres"><button type="button">Genres</button></th>
        <th scope="col" data-k="addedOn" aria-sort="descending" title="When the game first appeared in this list (the first import is all one date)"><button type="button">Added</button></th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<dialog id="cover" aria-label="Cover art"><img id="cover-img" alt=""></dialog>
<script>
// Only a plain file name in this folder: a crafted link must not load someone else's list.
const asked = new URLSearchParams(location.search).get("src");
const src = asked && /^[\w-]+\.json$/.test(asked) ? asked : "games.json";
let games = [], sortKey = "addedOn", sortDir = -1, open = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const yn = (v) => v === null || v === undefined ? "?" : v ? "Yes" : "No";
const withMax = (v, max) => v === null || v === undefined ? "?" : v ? (max ? `Yes (${esc(max)})` : "Yes") : "No";
const players = (g) =>
  g.localPlayers == null && g.onlinePlayers == null ? "?" : `${esc(g.localPlayers ?? "?")} / ${esc(g.onlinePlayers ?? "?")}`;
// Sony's image service resizes on request; the list shows 40px thumbnails.
const SONY_IMG = "https://image.api.playstation.com/";
const thumb = (url) => url.startsWith(SONY_IMG) ? `${url}${url.includes("?") ? "&" : "?"}w=96` : url;
function links(g) {
  const concept = /^concept:(\d+)$/.exec(g.id);
  const out = [];
  if (concept) out.push(`<a href="https://store.playstation.com/en-no/concept/${concept[1]}" target="_blank" rel="noopener">PlayStation Store</a>`);
  if (typeof g.igdbUrl === "string" && g.igdbUrl.startsWith("https://www.igdb.com/")) out.push(`<a href="${esc(g.igdbUrl)}" target="_blank" rel="noopener">IGDB</a>`);
  return out.length ? `<div class="links">${out.join("")}</div>` : "";
}

function keep(g) {
  const a = $("access").value;
  if (a === "present" && g.access === "gone") return false;
  if (a !== "present" && a !== "all" && g.access !== a) return false;
  const q = $("q").value.trim().toLowerCase();
  if (q && !g.title.toLowerCase().includes(q)) return false;
  if ($("platform").value && !g.platforms.includes($("platform").value)) return false;
  const c = $("couch").value;
  if (c === "coop" && !g.couchCoop) return false;
  if (c === "versus" && !g.couchVersus) return false;
  if (c === "any" && !g.couchCoop && !g.couchVersus && !(g.localPlayers >= 2)) return false;
  const o = $("online").value;
  if (o === "coop" && !g.onlineCoop) return false;
  if (o === "versus" && !g.onlineVersus) return false;
  if ($("solo").checked && !g.soloStory) return false;
  return true;
}

// Unknown values sort last in both directions.
function cmp(a, b) {
  const x = a[sortKey], y = b[sortKey];
  const xn = x === null || x === undefined, yn2 = y === null || y === undefined;
  if (xn || yn2) return xn === yn2 ? 0 : xn ? 1 : -1;
  const xs = Array.isArray(x) ? x.join(",") : x, ys = Array.isArray(y) ? y.join(",") : y;
  return xs === ys ? 0 : (xs < ys ? -1 : 1) * sortDir;
}

function row(g) {
  const tags = (g.access === "claimed" ? '<span class="tag">PS Plus</span>' : "") +
    (g.access === "gone" ? `<span class="tag">Gone ${esc(g.goneOn || "")}</span>` : "");
  return `
    <tr class="game${g.access === "gone" ? " gone" : ""}">
      <td class="cover">${g.coverUrl ? `<button type="button" data-cover="${esc(g.coverUrl)}" aria-label="Show cover of ${esc(g.title)}"><img loading="lazy" alt="" src="${esc(thumb(g.coverUrl))}"></button>` : ""}</td>
      <th scope="row"><button type="button" data-id="${esc(g.id)}" aria-expanded="${open === g.id}">${esc(g.title)}</button>${tags}</th>
      <td data-label="Platform">${esc((g.platforms || []).join(", "))}</td>
      <td data-label="Year">${esc(g.releaseYear ?? "?")}</td>
      <td data-label="Age" class="nowrap">${esc(g.ageRating ?? "?")}</td>
      <td data-label="Solo story">${yn(g.soloStory)}</td>
      <td data-label="Couch co-op">${withMax(g.couchCoop, g.couchCoopMax)}</td>
      <td data-label="Couch versus">${withMax(g.couchVersus, g.couchVersusMax)}</td>
      <td data-label="Online co-op">${withMax(g.onlineCoop, g.onlineCoopMax)}</td>
      <td data-label="Online versus">${withMax(g.onlineVersus, g.onlineVersusMax)}</td>
      <td data-label="Players (local / online)">${players(g)}</td>
      <td data-label="Genres">${esc((g.genres || ["?"]).join(", "))}</td>
      <td data-label="Added" class="nowrap">${esc(g.addedOn)}</td>
    </tr>
    ${open === g.id ? `<tr class="desc"><td colspan="13">${esc(g.description ?? "No description.")}${links(g)}</td></tr>` : ""}`;
}

function render() {
  const list = games.filter(keep).sort(cmp);
  $("count").textContent = `${list.length} of ${games.length} games`;
  $("rows").innerHTML = list.map(row).join("");
}

document.querySelectorAll("thead th[data-k]").forEach((th) => th.querySelector("button").addEventListener("click", () => {
  const k = th.dataset.k;
  sortDir = sortKey === k ? -sortDir : 1;
  sortKey = k;
  document.querySelectorAll("thead th").forEach((x) => x.removeAttribute("aria-sort"));
  th.setAttribute("aria-sort", sortDir === 1 ? "ascending" : "descending");
  render();
}));
$("rows").addEventListener("click", (e) => {
  const c = e.target.closest("button[data-cover]");
  if (c) {
    $("cover-img").src = c.dataset.cover;
    $("cover").showModal();
    return;
  }
  const b = e.target.closest("button[data-id]");
  if (!b) return;
  open = open === b.dataset.id ? null : b.dataset.id;
  render();
  document.querySelector(`button[data-id="${CSS.escape(b.dataset.id)}"]`)?.focus();
});
// A click anywhere on the open cover (or its backdrop) closes it; Esc works natively.
$("cover").addEventListener("click", () => $("cover").close());
["q", "access", "platform", "couch", "online", "solo"].forEach((id) => $(id).addEventListener("input", render));

// Over 40 days means at least one monthly run has been missed.
const STALE_DAYS = 40;
function showSync(lastSync) {
  if (!lastSync) return;
  $("sync").textContent = `Updated ${lastSync}`;
  const days = (Date.now() - Date.parse(`${lastSync}T00:00:00Z`)) / 86400000;
  if (days > STALE_DAYS) {
    $("stale-date").textContent = lastSync;
    $("stale").hidden = false;
  }
}

fetch(src).then((r) => r.json()).then((d) => { games = d.games; showSync(d.lastSync); render(); })
  .catch(() => { $("count").textContent = "Could not load the game list."; });
</script>
</body>
</html>
